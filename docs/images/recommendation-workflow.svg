<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">Movie and music recommendation workflow</title>
  <desc id="description">A visitor chooses movie or music recommendations. Movie requests can be content-based, single-user, or grouped multi-user and use a hybrid rating model. Music requests select one of four similarity models and return the top five songs. Login is marked as a proposed step and is not implemented.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#506174" />
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172b3a; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #506174; }
      .lane-title { font: 700 19px 'Segoe UI', sans-serif; fill: #172b3a; }
      .label { font: 600 15px 'Segoe UI', sans-serif; fill: #172b3a; }
      .body { font: 400 13px 'Segoe UI', sans-serif; fill: #405264; }
      .small { font: 600 11px 'Segoe UI', sans-serif; fill: #52687a; }
      .step { fill: #ffffff; stroke: #b8c5cf; stroke-width: 1.5; }
      .movie { fill: #eff6ff; stroke: #4f83cc; stroke-width: 1.7; }
      .music { fill: #effaf6; stroke: #38a58a; stroke-width: 1.7; }
      .hybrid { fill: #fff4e5; stroke: #e28a35; stroke-width: 2.5; }
      .group { fill: #f2efff; stroke: #7967c6; stroke-width: 2; }
      .planned { fill: #f8fafb; stroke: #a7b2bb; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { fill: none; stroke: #718397; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #9aa8b4; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1000" rx="20" fill="#f7f9fb" />
  <text x="600" y="55" text-anchor="middle" class="title">Recommendation workflow</text>
  <text x="600" y="82" text-anchor="middle" class="subtitle">Two discovery paths, with hybrid and group-aware movie ranking highlighted</text>

  <rect x="422" y="108" width="356" height="64" rx="14" class="planned" />
  <text x="600" y="135" text-anchor="middle" class="label">Login / account check</text>
  <text x="600" y="156" text-anchor="middle" class="small">Proposed in report flow; not implemented in current code</text>

  <path d="M600 172 V198" class="line-dashed" />
  <polygon points="600,198 690,245 600,292 510,245" class="step" />
  <text x="600" y="241" text-anchor="middle" class="label">Choose</text>
  <text x="600" y="261" text-anchor="middle" class="label">recommender</text>

  <path d="M510 245 H150 V327" class="line" />
  <path d="M690 245 H1050 V327" class="line" />
  <text x="332" y="232" text-anchor="middle" class="small">MOVIES</text>
  <text x="868" y="232" text-anchor="middle" class="small">MUSIC</text>

  <rect x="42" y="327" width="516" height="580" rx="18" fill="#ffffff" stroke="#9bbce7" stroke-width="2" />
  <rect x="642" y="327" width="516" height="580" rx="18" fill="#ffffff" stroke="#91cfbd" stroke-width="2" />
  <text x="300" y="365" text-anchor="middle" class="lane-title">Movie recommender</text>
  <text x="900" y="365" text-anchor="middle" class="lane-title">Music recommender</text>

  <rect x="112" y="391" width="376" height="72" rx="12" class="movie" />
  <text x="300" y="420" text-anchor="middle" class="label">Choose title and recommendation mode</text>
  <text x="300" y="443" text-anchor="middle" class="body">Content-based · single user · multiple users</text>
  <path d="M300 463 V495" class="line" />

  <rect x="112" y="495" width="376" height="72" rx="12" class="step" />
  <text x="300" y="524" text-anchor="middle" class="label">Movie metadata + rating history</text>
  <text x="300" y="547" text-anchor="middle" class="body">Descriptions, genres, user-item ratings</text>
  <path d="M300 567 V599" class="line" />

  <rect x="112" y="599" width="376" height="94" rx="12" class="hybrid" />
  <text x="300" y="630" text-anchor="middle" class="label">Hybrid movie scoring</text>
  <text x="300" y="655" text-anchor="middle" class="body">80% Surprise SVD + 20% TruncatedSVD</text>
  <text x="300" y="677" text-anchor="middle" class="small">Content similarity helps form candidate titles</text>
  <path d="M300 693 V722" class="line" />

  <rect x="88" y="722" width="424" height="92" rx="12" class="group" />
  <text x="300" y="753" text-anchor="middle" class="label">Grouped recommendations</text>
  <text x="300" y="777" text-anchor="middle" class="body">Average predicted scores across selected users</text>
  <text x="300" y="798" text-anchor="middle" class="small">Choose unseen movies or movies already rated</text>
  <path d="M300 814 V843" class="line" />

  <rect x="150" y="843" width="300" height="44" rx="12" fill="#172b3a" />
  <text x="300" y="871" text-anchor="middle" style="font:600 15px 'Segoe UI',sans-serif;fill:#fff">Ranked movie results</text>

  <rect x="712" y="391" width="376" height="72" rx="12" class="music" />
  <text x="900" y="420" text-anchor="middle" class="label">Choose song and model</text>
  <text x="900" y="443" text-anchor="middle" class="body">Count · TF-IDF · combined · lyrics</text>
  <path d="M900 463 V495" class="line" />

  <rect x="712" y="495" width="376" height="72" rx="12" class="step" />
  <text x="900" y="524" text-anchor="middle" class="label">Song metadata or lyric corpus</text>
  <text x="900" y="547" text-anchor="middle" class="body">Local datasets and saved similarity matrix</text>
  <path d="M900 567 V599" class="line" />

  <rect x="712" y="599" width="376" height="94" rx="12" class="music" />
  <text x="900" y="630" text-anchor="middle" class="label">Cosine-similarity models</text>
  <text x="900" y="655" text-anchor="middle" class="body">Combined score = (Count + TF-IDF) / 2</text>
  <text x="900" y="677" text-anchor="middle" class="small">Lyrics model uses its precomputed similarity data</text>
  <path d="M900 693 V722" class="line" />

  <rect x="712" y="722" width="376" height="92" rx="12" class="step" />
  <text x="900" y="753" text-anchor="middle" class="label">Rank nearest songs</text>
  <text x="900" y="777" text-anchor="middle" class="body">Skip the selected song and return up to five</text>
  <text x="900" y="798" text-anchor="middle" class="small">Spotify artwork is optional</text>
  <path d="M900 814 V843" class="line" />

  <rect x="750" y="843" width="300" height="44" rx="12" fill="#176b58" />
  <text x="900" y="871" text-anchor="middle" style="font:600 15px 'Segoe UI',sans-serif;fill:#fff">Ranked song results</text>

  <rect x="468" y="932" width="264" height="38" rx="19" fill="#fff4e5" stroke="#e8c08e" />
  <text x="600" y="956" text-anchor="middle" class="small">Hybrid movie model + multi-user group ranking</text>
</svg>